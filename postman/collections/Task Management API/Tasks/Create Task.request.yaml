$kind: http-request
method: POST
url: '{{baseUrl}}/api/v1/tasks'
order: 1000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{token}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "title": "My Task",
      "description": "Task description",
      "project_id": 1,
      "status": "todo"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Created", function() { pm.response.to.have.status(201); });
      var json = pm.response.json();
      if(json.data && json.data.id) { pm.collectionVariables.set("taskId", String(json.data.id)); }
