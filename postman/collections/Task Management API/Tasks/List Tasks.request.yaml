$kind: http-request
method: GET
url: '{{baseUrl}}/api/v1/tasks?project_id={{projectId}}&page=1&limit=10'
order: 2000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{token}}'
queryParams:
  - key: project_id
    value: '{{projectId}}'
  - key: page
    value: '1'
  - key: limit
    value: '10'
