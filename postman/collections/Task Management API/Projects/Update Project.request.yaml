$kind: http-request
method: PUT
url: '{{baseUrl}}/api/v1/projects/{{projectId}}'
order: 4000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{token}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "name": "Updated Project",
      "description": "Updated description"
    }
